services:
  database:
    image: postgres:17-alpine
    container_name: hotmart-postgres

    environment:
      POSTGRES_DB: ai_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_chat"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile

    container_name: hotmart-backend

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/ai_chat
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    ports:
      - "8080:8080"

    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile

    container_name: hotmart-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

volumes:
  postgres_data:
